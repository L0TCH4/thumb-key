name: Apply Japanese overlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack overlay
        run: |
          test -f ja-overlay.zip
          unzip -o ja-overlay.zip
          rm ja-overlay.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Japanese kana-kanji conversion"
          git push
